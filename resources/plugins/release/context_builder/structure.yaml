name: default

structure:

  children:
    - docker
    - openshift
    - database
    - scripts

  docker:
    path: App/services
    type: directory

    children:

      service:
        type: directory

        children:

          image:
            path: image
            type: directory

            dockerfile:
              name: Dockerfile

  openshift:
    # App/openshift in release packages; App (with App/yamls) in
    # App-Published packages.
    path:
      - App/openshift
      - App
    type: directory

    children:

      yamls:
        path: yamls
        type: directory

      common_path:
        path: common_path
        type: directory

        rsync_plan:
          names:
            - rsync_plan.yaml
            - rsync_plan.yml
            - rsync_plan.json

  database:
    path: DBScripts
    type: directory

    scripts:
      extensions:
        - .sql

    execution_plan:
      names:
        - execution_plan.yaml
        - execution_plan.yml
        - execution_plan.json

  # Deployment scripts (image_transfer.sh, apply_yaml.sh). Listed so a
  # release that only ships scripts is still recognised; the image
  # transfer script is read through the image_transfer_script argument.
  scripts:
    path: scripts/deploy
    type: directory
