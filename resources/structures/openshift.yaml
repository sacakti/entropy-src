kinds:

  Deployment:

    metadata:
      remove:
        - creationTimestamp
        - generation
        - resourceVersion
        - uid
        - managedFields

      annotations:
        remove:
          - kubectl.kubernetes.io/last-applied-configuration
          - deployment.kubernetes.io/revision

    spec:
      template:
        metadata:
          remove:
            - creationTimestamp

          annotations:
            remove:
              - kubectl.kubernetes.io/restartedAt
              - openshift.openshift.io/restartedAt

    status:
      remove: true


  ConfigMap:

    metadata:
      remove:
        - creationTimestamp
        - generation
        - resourceVersion
        - uid
        - managedFields

      annotations:
        remove:
          - kubectl.kubernetes.io/last-applied-configuration

    status:
      remove: true


  Secret:

    metadata:
      remove:
        - creationTimestamp
        - generation
        - resourceVersion
        - uid
        - managedFields

      annotations:
        remove:
          - kubectl.kubernetes.io/last-applied-configuration

    status:
      remove: true


  Service:

    metadata:
      remove:
        - creationTimestamp
        - generation
        - resourceVersion
        - uid
        - managedFields

      annotations:
        remove:
          - kubectl.kubernetes.io/last-applied-configuration

    status:
      remove: true


  Route:

    metadata:
      remove:
        - creationTimestamp
        - generation
        - resourceVersion
        - uid
        - managedFields

      annotations:
        remove:
          - kubectl.kubernetes.io/last-applied-configuration

    status:
      remove: true
