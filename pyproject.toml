[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy"
version = "3.2.0"
description = "Entropy Deployment Framework"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

authors = [
    { name = "Sacakti" }
]

keywords = [
    "deployment",
    "automation",
    "workflow",
    "orchestration",
    "cli"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development",
    "Private :: Do Not Upload"
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]

dev = [
    "black>=25.0.0",
    "ruff>=0.12.0",
    "isort>=6.0.0",
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "httpx>=0.27.0",
    "bandit>=1.8.0",
    "pre-commit>=4.2.0",
    "build>=1.3.0",
    "twine>=6.1.0",
    "pip-audit>=2.9.0"
]

[tool.setuptools.packages.find]
include = [
    "core*",
    "lib*",
    "plugins*",
]
exclude = [
    "tests*",
    "logs*",
    "tmp*",
    "resources*",
]

##########################################################
# Black
##########################################################

[tool.black]

line-length = 100
target-version = ["py313"]
include = '\.pyi?$'

##########################################################
# isort
##########################################################

[tool.isort]

profile = "black"
line_length = 100
py_version = 313
combine_as_imports = true
force_sort_within_sections = true

##########################################################
# Ruff
##########################################################

[tool.ruff]

line-length = 100
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "tmp",
    "logs",
    "__pycache__"
]

[tool.ruff.lint.per-file-ignores]
"scripts/install.py" = ["E402"]
"scripts/uninstall.py" = ["E402"]
"entropy.py" = ["E402"]
"lib/migrations/scripts/*.py" = ["N999"]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "N",
    "W"
]

ignore = [
    "B024",
    "N818",  # Framework uses *Exception
    "B024",  # Marker abstract base classes
    # Typing style: modernising Optional/List/Dict to X | None, list, dict is a
    # separate change (the remote ent client in lib/remote_cli stays Python 3.9).
    "UP006",
    "UP035",
    "UP045",
    # Also deferred to that change: datetime.UTC, StrEnum, X | Y unions, zip(strict=).
    "UP007",
    "UP017",
    "UP042",
    "B905",
    "B027",
]


##########################################################
# mypy
##########################################################

[tool.mypy]

python_version = "3.13"

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

check_untyped_defs = true

disallow_untyped_defs = false
disallow_incomplete_defs = false

ignore_missing_imports = true

##########################################################
# pytest
##########################################################

[tool.pytest.ini_options]
minversion = "8.0"

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    "-ra",
    "--strict-markers",
]

filterwarnings = [
    "error",
    # ldap3 2.9 still uses pyasn1's old names.
    "ignore:.* is deprecated. Please use .* instead.:DeprecationWarning:pyasn1",
    # Python 3.13 warns when a sqlite3 connection is garbage collected unclosed. Test
    # fixtures open throwaway databases; the warning surfaces in whichever test runs
    # when the collector does, so it is not attributable. (The server keeps its
    # connections open for the life of the process.)
    "ignore:unclosed database in <sqlite3.Connection:ResourceWarning",
]

##########################################################
# Coverage
##########################################################

[tool.coverage.run]

branch = true
source = [
    "core",
    "lib"
]

##########################################################
# Bandit
##########################################################

[tool.bandit]

exclude_dirs = [
    "tests",
    "build",
    "tmp"
]
