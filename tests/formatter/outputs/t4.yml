apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-1
  namespace: entropy-uat
  labels:
    app: app-1
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-1
  template:
    metadata:
      labels:
        app: app-1
    spec:
      containers:
      - name: app-1
        image: quay.io/project1/app-1:1.1.7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: uat
        - name: JAVA_OPTS
          value: -Xms256m -Xmx512m
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
