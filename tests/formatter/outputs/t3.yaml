apiVersion: v1
kind: ConfigMap
metadata:
  name: application-config
  namespace: entropy-uat
data:
  environment: uat
  application.properties: |-
    application.name=entropy
    application.port=8081
    application.timeout=30000
    spring.datasource.url=jdbc:postgresql://database:5432/app
    spring.datasource.username=appuser
  redis.yaml: |-
    nettyThreads: 64
    singleServerConfig:
      timeout: 1500
      connectionMinimumIdleSize: 8
  simple.txt: |-
    hello
    world
    this is a test
